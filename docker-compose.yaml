services:
  mysql:
    image: mysql:8.0
    container_name: book-inventory-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Madusha123}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-book_inventory}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql  # Mount the initialization script to create the database and tables
#   healthcheck:
#    test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
#    interval: 10s
#    timeout: 5s
#    retries: 5


  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: book-inventory-backend
    environment:
      PORT: 5000
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Madusha123}
      DB_NAME: ${MYSQL_DATABASE:-book_inventory}
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    container_name: book-inventory-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mysql_data: 